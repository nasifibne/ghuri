button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(250,247,241,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--ink)}
.logo img{flex:none;display:block}
nav{display:flex;gap:4px;margin-left:auto;align-items:center}
nav a{padding:8px 12px;border-radius:999px;color:var(--ink2);font-weight:500;font-size:15px;white-space:nowrap}
nav a.active{background:var(--green-l);color:var(--green-d)}
nav a.cta{background:var(--orange);color:#fff}
nav a.cta.active{background:#d96303;color:#fff}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:14px;cursor:pointer;font-weight:600}
@media (max-width:640px){
  .hbar{height:56px}
  nav a.hide-sm{display:none}
  nav a{padding:7px 10px;font-size:14px}
  .logo{font-size:20px}
}
.tabbar{display:none}
@media (max-width:640px){
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1;text-align:center;padding:10px 4px 8px;font-size:13px;color:var(--ink2);font-weight:500}
  .tabbar a.active{color:var(--green-d);font-weight:700}
  .tabbar svg{display:block;margin:0 auto 2px}
  main{padding-bottom:80px}
}

/* banners */
.demo{background:var(--gold-l);border:1px solid #f1d9a8;color:#6b4a12;border-radius:10px;padding:10px 14px;font-size:14px;margin:16px 0 0}

/* hero */
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(26px,5vw,40px);font-weight:700;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p{color:var(--ink2);margin:8px 0 0;max-width:620px}
.stats{display:flex;gap:20px;margin-top:16px;flex-wrap:wrap}
.stat b{display:block;font-size:22px;color:var(--ink)}
.stat span{font-size:13px;color:var(--ink2)}

/* filters */
.filters{margin:20px 0 8px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.flabel{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-weight:500;font-size:15px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.frow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;margin-top:12px}
@media (max-width:820px){.frow{grid-template-columns:1fr 1fr}.frow .search{grid-column:1/-1}}
.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px;min-height:44px}
.field:focus{outline:2px solid var(--green);outline-offset:-1px;border-color:var(--green)}
textarea.field{min-height:80px;resize:vertical}

/* cards */
.count{color:var(--ink2);font-size:14px;margin:16px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:32px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.cover{position:relative;height:150px;background-size:cover;background-position:center}
.cover .price{position:absolute;right:10px;bottom:10px;background:#fff;color:var(--ink);border-radius:10px;padding:4px 10px;font-weight:700;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cover .price small{font-weight:500;font-size:12px;color:var(--ink2);margin-left:2px}
.badges{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:#fff;color:var(--ink)}
.badge.gem{background:var(--orange);color:#fff}
.badge.sample{background:var(--gold-l);color:#6b4a12}
.badge.local{background:var(--green-l);color:var(--green-d)}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cbody h3{font-size:17px;font-weight:600}
.meta{color:var(--ink2);font-size:14px}
.cfoot{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink2);margin:16px 0 32px}
.empty a{display:inline-block;margin-top:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:15px;min-height:42px;color:var(--ink)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:disabled{opacity:.6;cursor:wait}
.btn.on{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.linkbtn{border:0;background:none;color:var(--red);cursor:pointer;font-weight:500;padding:4px}

/* trip page */
.back{display:inline-block;margin:16px 0 8px;color:var(--ink2);font-weight:500}
.thead{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media (max-width:820px){.thead{grid-template-columns:1fr}}
.gallery{border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:16/10;background-size:cover;background-position:center}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs button{width:64px;height:48px;border-radius:8px;border:2px solid transparent;background-size:cover;background-position:center;cursor:pointer;padding:0}
.thumbs button.on{border-color:var(--green)}
.tsum h1{font-size:clamp(24px,4vw,32px);font-weight:700;margin:4px 0 8px}
.pricebox{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:12px 0}
.pricebox .big{font-size:34px;font-weight:700;color:var(--green-d);line-height:1}
.pricebox .big small{font-size:15px;color:var(--ink2);font-weight:500}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:14px;color:var(--ink2)}
.kv b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.section{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:16px 0}
.section h2{font-size:19px;font-weight:700;margin-bottom:12px}
.plist{list-style:none;margin:0;padding:0;counter-reset:p}
.plist li{position:relative;padding:0 0 16px 40px;counter-increment:p}
.plist li:before{content:counter(p);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--green-l);color:var(--green-d);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.plist li:not(:last-child):after{content:"";position:absolute;left:13px;top:30px;bottom:2px;border-left:2px dashed var(--line)}
.plist .pn{font-weight:600;font-size:17px}
.plist .pn a{color:var(--ink)}
.plist .pn a:hover{color:var(--green)}
.plist .pd{font-size:14px;color:var(--ink2)}
.ctable{width:100%;border-collapse:collapse;font-size:15px}
.ctable th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
.ctable td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ctable td.n,.ctable th.n{text-align:right;white-space:nowrap}
.ctable tfoot td{font-weight:700;border-bottom:0;padding-top:12px}
.cat{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--green-l);color:var(--green-d)}
.tip{background:var(--green-l);border-left:4px solid var(--green);border-radius:8px;padding:12px 14px;white-space:pre-wrap}
.warn{background:var(--red-l);border-left:4px solid var(--red);border-radius:8px;padding:12px 14px;white-space:pre-wrap;margin-top:10px}
.vote{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.comments{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.cm{border-bottom:1px solid var(--line);padding-bottom:10px}
.cm b{font-weight:600}
.cm span{color:var(--ink2);font-size:13px;margin-left:6px}
.cm p{margin:4px 0 0;white-space:pre-wrap}
.cform{display:grid;gap:8px}
.muted{color:var(--ink2);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.quote{border-left:3px solid var(--line);padding:4px 12px;margin:8px 0;color:var(--ink)}
.quote small{display:block;color:var(--ink2)}

/* form */
.form{max-width:760px;margin:0 auto 40px}
.form h1{font-size:28px;margin:20px 0 4px}
.fsec{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:16px 0}
.fsec h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.fsec h2 .step{width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.fg{display:grid;gap:12px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.fg2{grid-template-columns:1fr}}
label.l{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.help{font-size:13px;color:var(--ink2);margin-top:4px}
.lock{display:inline-flex;align-items:center;gap:4px;color:var(--green-d);font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--green)}
.rowcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;gap:8px;background:#fdfcf9}
.rowhead{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;color:var(--ink2)}
.costrow{display:grid;grid-template-columns:1.1fr 1.6fr 1fr 1.1fr auto;gap:8px;align-items:center;margin-bottom:8px}
@media (max-width:640px){.costrow{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fdfcf9}.costrow .what{grid-column:1/-1;order:-1}}
.live{position:sticky;bottom:0;background:var(--green-d);color:#fff;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
@media (max-width:640px){.live{bottom:64px}}
.live b{font-size:22px}
.vibes{display:flex;flex-wrap:wrap;gap:8px}
.vibes label{border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;background:#fff}
.vibes input{display:none}
.vibes label:has(input:checked){background:var(--green);border-color:var(--green);color:#fff}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos div{width:80px;height:60px;border-radius:8px;background-size:cover;background-position:center}
.mapfind{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--green);margin-top:6px}
.field.bad{border-color:var(--red);outline:2px solid var(--red);outline-offset:-1px}
.mapbtn{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--green);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-top:4px;background:#fff}
.err{color:var(--red);font-size:14px;font-weight:500;margin-top:8px;min-height:20px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
@media (min-width:641px){.modal{align-items:center}}
.mbox{background:#fff;border-radius:16px;padding:20px;max-width:440px;width:100%}
.mbox h3{font-size:19px;margin-bottom:12px}
.mbox .check{padding:6px 0}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
footer{color:var(--ink2);font-size:13px;text-align:center;padding:24px 16px 32px}
.loading{padding:40px;text-align:center;color:var(--ink2)}
</style>
</head>

const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const lsGet = k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
const lsSet = (k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const state = {
  lang: lsGet('ghuri_lang') || 'en',
  trips: [], loaded:false, loadError:false,
  f:{budget:0, from:'', length:'', vibe:'', q:'', sort:'new'},
  saved: new Set(lsGet('ghuri_saved')||[]),
  voted: lsGet('ghuri_voted')||{},
  draft: null
};
function t(k,...a){ const v=(T[state.lang]&&T[state.lang][k]!==undefined)?T[state.lang][k]:T.en[k]; return typeof v==='function'?v(...a):(v==null?k:v); }
const locale = ()=> state.lang==='bn'?'bn-BD':'en-IN';
function fmtNum(n){ return Math.round(Number(n)||0).toLocaleString(locale()); }
const tk = n => '৳'+fmtNum(n);
function fmtMonth(ym){ if(!ym) return ''; const [y,m]=ym.split('-').map(Number); try{return new Date(y,m-1,1).toLocaleDateString(locale(),{month:'short',year:'numeric'})}catch(e){return ym} }
function fmtDate(iso){ try{return new Date(iso).toLocaleDateString(locale(),{day:'numeric',month:'short'})}catch(e){return ''} }
function calcPP(costs, gs){ gs=Math.max(1,Number(gs)||1); let pp=0; for(const c of costs){ const a=Number(c.amount)||0; pp += c.per==='group' ? a/gs : a; } return Math.round(pp); }
function hashStr(s){ let h=5381; for(const ch of s) h=((h<<5)+h+ch.codePointAt(0))>>>0; return h.toString(36); }
const placeKey = p => (String(p.name||'').trim().toLowerCase().replace(/\s+/g,' '))+'|'+(p.district||'');
const placeSlug = p => 'place-'+hashStr(placeKey(p));
function safeImg(src){ if(typeof src!=='string') return ''; if(src.startsWith('data:image/')) return src; if(LIVE && src.startsWith(CFG.SUPABASE_URL)) return src; return ''; }
function extractMap(txt){ const m=String(txt||'').match(/https:\/\/[^\s<>"']+/i); return m?safeMap(m[0].replace(/[).,]+$/,'')):''; }
const gmapsSearch=(name,district)=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([name,district,'Bangladesh'].filter(Boolean).join(', '));
function safeMap(u){ if(typeof u!=='string') return ''; u=u.trim(); return /^https:\/\/(www\.)?(google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(u)?u:''; }
function coverStyle(tr){ const ph=safeImg((tr.photos||[])[0]); if(ph) return `background-image:url('${ph.replace(/'/g,'%27')}')`; const c=COVERS[(tr.vibes||[])[0]]||['#005439','#9cc98a']; return `background-image:linear-gradient(135deg,${c[0]},${c[1]})`; }
function accText(tr){ const n=(tr.up_votes||0)+(tr.down_votes||0); if(!n) return t('accNone'); return t('acc', Math.round(100*(tr.up_votes||0)/n), n); }
function errText(e){ if(!e) return ''; const parts=[e.code,e.message||String(e),e.hint].filter(Boolean); return parts.join(' · ').slice(0,300); }
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2600); }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function resizeImage(file, max=1280, q=0.75){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error('resize')),'image/jpeg',q); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'))}; img.src=url;
  });
}
const blobToDataURL = b => new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b);});

/* ============================ data stores ============================ */
const DemoStore = {
  key:'ghuri_demo_v2', db:null,
  load(){ if(this.db) return this.db; let d=lsGet(this.key);
    if(!d){ const now=Date.now(); d={trips:SAMPLE_TRIPS.map((s,i)=>({...s,places:s.places.map(p=>({...p,map:p.exact?gmapsSearch(p.name,p.district):''})),id:'sample-'+(i+1),sample:true,photos:[],created_at:new Date(now-i*86400000*3).toISOString(),per_person:calcPP(s.costs,s.group_size),total:calcPP(s.costs,s.group_size)*s.group_size,status:'published'})),comments:{},reports:{}}; }
    this.db=d; return d; },
  persist(){ lsSet(this.key,this.db); },
  async listTrips(){ return this.load().trips.filter(x=>x.status==='published'); },
  async createTrip(p, phone, files){
    const photos=[]; for(const f of files){ try{ photos.push(await blobToDataURL(await resizeImage(f,900,0.7))); }catch(e){} }
    const pp=calcPP(p.costs,p.group_size);
    p={...p, places:p.places.map(x=>x.exact?x:{...x,map:''})};
    const trip={...p, id:uid(), created_at:new Date().toISOString(), photos, per_person:pp, total:pp*p.group_size, up_votes:0, down_votes:0, status:'published'};
    this.load().trips.unshift(trip);
    if(!this.persist_ok()){ trip.photos=[]; this.persist(); }
    return trip.id;
  },
  persist_ok(){ return lsSet(this.key,this.db); },
  async vote(id,up){ const tr=this.load().trips.find(x=>x.id===id); if(tr){ up?tr.up_votes++:tr.down_votes++; this.persist(); } },
  async listComments(id){ return this.load().comments[id]||[]; },
  async addComment(id,name,body){ const d=this.load(); (d.comments[id]=d.comments[id]||[]).push({id:uid(),name,body,created_at:new Date().toISOString()}); this.persist(); },
  async report(id,reason){ const d=this.load(); (d.reports[id]=d.reports[id]||[]).push(reason); if(d.reports[id].length>=3){ const tr=d.trips.find(x=>x.id===id); if(tr) tr.status='hidden'; } this.persist(); }
};
const LiveStore = {
  c:null,
  async init(){ await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'); this.c=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY); },
  async listTrips(){ const {data,error}=await this.c.from('trips').select('*').eq('status','published').order('created_at',{ascending:false}).limit(1000); if(error) throw error; return data||[]; },
  async createTrip(p, phone, files){
    const photos=[];
    for(const f of files){ const blob=await resizeImage(f); const path=`${new Date().toISOString().slice(0,7)}/${uid()}.jpg`;
      const {error}=await this.c.storage.from('trip-photos').upload(path,blob,{contentType:'image/jpeg'}); if(error) throw error;
      photos.push(this.c.storage.from('trip-photos').getPublicUrl(path).data.publicUrl); }
    const {data,error}=await this.c.rpc('create_trip',{p:{...p,photos},phone}); if(error) throw error; return data;
  },
  async vote(id,up){ const {error}=await this.c.rpc('vote_trip',{tid:id,is_up:up}); if(error) throw error; },
  async listComments(id){ const {data,error}=await this.c.from('comments').select('*').eq('trip_id',id).order('created_at',{ascending:true}); if(error) throw error; return data||[]; },
  async addComment(id,name,body){ const {error}=await this.c.from('comments').insert({trip_id:id,name,body}); if(error) throw error; },
  async report(id,reason){ const {error}=await this.c.from('reports').insert({trip_id:id,reason}); if(error) throw error; }
};
const store = LIVE ? LiveStore : DemoStore;

/* ============================ HOME ============================ */
function filtered(){
  const f=state.f, q=f.q.trim().toLowerCase();
  let list=state.trips.filter(tr=>{
    if(f.budget && tr.per_person>f.budget) return false;
    if(f.from && tr.start_district!==f.from) return false;
    if(f.length && tr.trip_length!==f.length) return false;
    if(f.vibe && !(tr.vibes||[]).includes(f.vibe)) return false;
    if(q){ const hay=[tr.title,tr.start_district,tr.tips,...(tr.places||[]).flatMap(p=>[p.name,p.district,p.note])].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const acc=tr=>{const n=(tr.up_votes||0)+(tr.down_votes||0); return n?((tr.up_votes||0)+1)/(n+2):0;};
  if(f.sort==='cheap') list.sort((a,b)=>a.per_person-b.per_person);
  else if(f.sort==='acc') list.sort((a,b)=>acc(b)-acc(a));
  else list.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  return list;
}

/* ============================ modal ============================ */
function openModal(html){
  const root=$('#modalRoot'); root.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="mbox">${html}</div></div>`;
  const m=root.firstElementChild; m.addEventListener('click',e=>{ if(e.target===m||e.target.closest('[data-close]')) closeModal(); });

}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function openReport(id){

/* ============================ PLACE ============================ */
function renderPlace(slug){
  setNav('');
  const hits=[]; let place=null;
  for(const tr of state.trips) for(const p of (tr.places||[])) if(placeSlug(p)===slug){ hits.push({tr,p}); place=place||p; }
  if(!place){ $('#app').innerHTML=`<a class="back" href="#home">${t('back')}</a><div class="empty">${state.loaded?t('notFound'):'…'}</div>`; return; }
  const trips=[...new Map(hits.map(h=>[h.tr.id,h.tr])).values()];
  const costs=trips.map(x=>x.per_person).sort((a,b)=>a-b); const med=costs[Math.floor((costs.length-1)/2)];
  const gem=hits.some(h=>h.p.gem);
  const notes=hits.filter(h=>h.p.note);
  const pmap=hits.map(h=>h.p.exact?safeMap(h.p.map):'').find(Boolean)||'';

    <a class="back" href="#home" id="placeBack">${t('back')}</a>
    <section class="hero" style="padding-top:8px">
      <div class="muted">${t('placeIn')} ${esc(place.district)}</div>

      <div class="stats"><div class="stat"><b>${fmtNum(trips.length)}</b><span>${t('stTrips')}</span></div><div class="stat"><b>${tk(med)}</b><span>${t('typical')}</span></div></div>
      ${pmap?`<a class="btn primary" style="margin-top:16px" href="${esc(pmap)}" target="_blank" rel="noopener noreferrer">📍 ${t('openGmaps')} ↗</a>`:`<div class="muted" style="margin-top:12px">🔒 ${t('areaOnly')}</div>`}
    </section>
    ${notes.length?`<section class="section"><h2>${t('notes')}</h2>${notes.map(h=>`<div class="quote">${esc(h.p.note)}<small>${esc(h.tr.author_name)} · ${fmtMonth(h.tr.trip_month)}</small></div>`).join('')}</section>`:''}
    <h2 style="font-size:19px;margin:20px 0 10px">${t('tripsHere')}</h2>

/* ============================ router ============================ */
function route(){
  const h=decodeURIComponent(location.hash.slice(1))||'home';
  if(h.startsWith('trip-')) renderTrip(h.slice(5));
  else if(h.startsWith('place-')) renderPlace(h);
  else if(h==='share') renderShare();
  else if(h==='saved') renderSaved();
  else renderHome();
}
window.addEventListener('hashchange',()=>{ closeModal(); route(); window.scrollTo(0,0); });
$('#langBtn').addEventListener('click',()=>{ state.lang=state.lang==='bn'?'en':'bn'; lsSet('ghuri_lang',state.lang); applyStatic(); route(); });

(async function init(){
  applyStatic(); route();
  try{ if(LIVE) await LiveStore.init(); }catch(e){ console.error(e); state.loadError=true; state.loadErrMsg='Could not load the Supabase library from cdn.jsdelivr.net'; state.loaded=true; route(); return; }
  await loadTrips(); route();
})();
</script>
